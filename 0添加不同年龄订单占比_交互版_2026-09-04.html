<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不同年龄消费者"0添加"食品订单量占比</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 28px 12px;
  }
  .wrap {
    background: transparent;
    padding: 18px 30px 26px;
    text-align: center;
    max-width: 820px;
  }
  svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }

  /* ---- 色块：初始不可见，通过动画逐个顺时针显现 ---- */
  .seg {
    fill: none;
    stroke-linecap: butt;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    cursor: pointer;
    transition: stroke-width .28s ease, filter .28s ease;
  }
  .run #seg1 { animation: drawSeg .55s ease .25s forwards; }
  .run #seg2 { animation: drawSeg 1.25s ease .75s forwards; }
  .run #seg3 { animation: drawSeg .95s ease 2.00s forwards; }
  .run #seg4 { animation: drawSeg .65s ease 2.95s forwards; }
  .run #seg5 { animation: drawSeg .45s ease 3.60s forwards; }
  @keyframes drawSeg { to { stroke-dashoffset: 0; } }

  /* ---- 悬浮：高亮 + 放大 ---- */
  .seg:hover {
    stroke-width: 102;
    filter: brightness(1.13) drop-shadow(0 3px 9px rgba(0,0,0,.30));
  }

  /* ---- 标签 / 引线 / 中心徽标：环形完成后淡入 ---- */
  .lead, .lbl, .pct, .badge { opacity: 0; }
  .run .lead { animation: fadeIn .5s ease 3.75s forwards; }
  .run .lbl  { animation: fadeIn .6s ease 3.85s forwards; }
  .run .pct  { animation: fadeIn .6s ease 3.95s forwards; }
  .run .badge{ animation: fadeIn .6s ease 4.05s forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .lead { stroke: #C9C5BD; stroke-width: 1.6; fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .lbl { fill: #4F463F; font-size: 23px; font-weight: 400; transition: fill .25s, font-weight .25s; }
  .pct { fill: #4F463F; font-size: 24px; font-weight: 700; transition: fill .25s; }
  .lbl.active { font-weight: 700; }
  .lead.active { stroke: #a8a39a; stroke-width: 2; }

  .tip { margin-top: 12px; font-size: 13px; color: #9a958e; }
</style>
</head>
<body>
<div class="wrap">
  <svg id="chart" width="720" height="772" viewBox="0 0 720 772" xmlns="http://www.w3.org/2000/svg">

    <!-- ============ 引线（折线：标签 → 水平段 → 斜线段 → 色块外缘，不与文字重合） ============ -->
    <polyline class="lead" id="lead1" points="575,308 520,308 453,264"></polyline>
    <polyline class="lead" id="lead2" points="605,441 558,441 538,415"></polyline>
    <polyline class="lead" id="lead3" points="330,675 272,675 264,565"></polyline>
    <polyline class="lead" id="lead4" points="114,441 160,441 182,415"></polyline>
    <polyline class="lead" id="lead5" points="142,308 205,308 239,285"></polyline>

    <!-- ============ 环形色块（顺时针从12点方向依次为 16-25 → 26-35 → 36-45 → 46-55 → 56+） ============ -->
    <!-- 16岁至25岁 10% -->
    <path class="seg" id="seg1" stroke="#DC7D66" stroke-width="86" pathLength="100"
          d="M 331.4 283.1 A 135 135 0 0 1 431.1 300.2"></path>
    <!-- 26岁至35岁 37% -->
    <path class="seg" id="seg2" stroke="#D76948" stroke-width="86" pathLength="100"
          d="M 429.9 299.6 A 135 135 0 0 1 396.5 545.0"></path>
    <!-- 36岁至45岁 33% -->
    <path class="seg" id="seg3" stroke="#E47D60" stroke-width="86" pathLength="100"
          d="M 397.9 544.6 A 135 135 0 0 1 226.6 435.7"></path>
    <!-- 46岁至55岁 13% -->
    <path class="seg" id="seg4" stroke="#E3896F" stroke-width="86" pathLength="100"
          d="M 226.8 436.9 A 135 135 0 0 1 268.6 315.6"></path>
    <!-- 56岁及以上 7% -->
    <path class="seg" id="seg5" stroke="#EBB49B" stroke-width="86" pathLength="100"
          d="M 267.3 317.0 A 135 135 0 0 1 332.3 282.8"></path>

    <!-- ============ 中心徽标："0添加"（绿色"0"环 + 内部"添加"） ============ -->
    <g class="badge">
      <circle cx="360" cy="415" r="40" fill="none" stroke="#6EAE48" stroke-width="10"></circle>
      <text x="360" y="423" text-anchor="middle" font-size="25" font-weight="700" fill="#6EAE48">添加</text>
    </g>

    <!-- ============ 标签文字 + 百分比 ============ -->
    <!-- 16岁至25岁 / 10%（右上） -->
    <text class="lbl" id="lbl1" x="600" y="268" text-anchor="middle">16岁至25岁</text>
    <text class="pct" id="pct1" x="600" y="301" text-anchor="middle">10%</text>
    <!-- 26岁至35岁 / 37%（右） -->
    <text class="lbl" id="lbl2" x="628" y="400" text-anchor="middle">26岁至35岁</text>
    <text class="pct" id="pct2" x="628" y="433" text-anchor="middle">37%</text>
    <!-- 36岁至45岁 / 33%（底部） -->
    <text class="lbl" id="lbl3" x="360" y="640" text-anchor="middle">36岁至45岁</text>
    <text class="pct" id="pct3" x="360" y="673" text-anchor="middle">33%</text>
    <!-- 46岁至55岁 / 13%（左） -->
    <text class="lbl" id="lbl4" x="92" y="400" text-anchor="middle">46岁至55岁</text>
    <text class="pct" id="pct4" x="92" y="433" text-anchor="middle">13%</text>
    <!-- 56岁及以上 / 7%（左上） -->
    <text class="lbl" id="lbl5" x="120" y="268" text-anchor="middle">56岁及以上</text>
    <text class="pct" id="pct5" x="120" y="301" text-anchor="middle">7%</text>

  </svg>

  <div class="tip">提示：色块会按顺时针逐个出现；将鼠标悬浮到任意色块上可查看高亮放大效果</div>
</div>

<script>
  var colors = {
    seg1: '#DC7D66', seg2: '#D76948', seg3: '#E47D60', seg4: '#E3896F', seg5: '#EBB49B'
  };
  var pairs = [
    ['seg1','lbl1','pct1','lead1'],
    ['seg2','lbl2','pct2','lead2'],
    ['seg3','lbl3','pct3','lead3'],
    ['seg4','lbl4','pct4','lead4'],
    ['seg5','lbl5','pct5','lead5']
  ];

  function bindHover() {
    pairs.forEach(function (p) {
      var seg = document.getElementById(p[0]);
      var lbl = document.getElementById(p[1]);
      var pct = document.getElementById(p[2]);
      var lead = document.getElementById(p[3]);
      var col = colors[p[0]];
      seg.addEventListener('mouseenter', function () {
        lbl.classList.add('active'); lbl.style.fill = col;
        pct.classList.add('active'); pct.style.fill = col;
        lead.classList.add('active');
      });
      seg.addEventListener('mouseleave', function () {
        lbl.classList.remove('active'); lbl.style.fill = '';
        pct.classList.remove('active'); pct.style.fill = '';
        lead.classList.remove('active');
      });
    });
  }

  // 首次进入自动播放
  document.getElementById('chart').classList.add('run');
  bindHover();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图2 · 替代成分出现频率</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:transparent;color:#000;font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7;padding:16px;}
  .wrap{max-width:820px;margin:0 auto;}
  h2{font-size:17px;font-weight:600;margin-bottom:2px;color:#000;}
  .dsc{color:#000;font-size:13px;margin-bottom:8px;}
  .chart{width:100%;height:380px;}
  .src{font-size:11.5px;color:#9A9184;margin-top:4px;border-top:1px dashed #E3DCCE;padding-top:4px;}
  .star{color:#B58E8E;font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <h2>图2 · 替代成分出现频率（17 条"宣传不实"样本内）</h2>
  <div class="dsc">一条商品可含多类替代成分，故条次数可叠加。糖类/代糖高居榜首——"0蔗糖"宣称背后最常见的套路是改用白砂糖/糖浆/蜂蜜或木糖醇/三氯蔗糖等代糖。<span class="star">★</span>为最典型案例：西麦玉米片"0添加蔗糖"实含三氯蔗糖；手撕素肉"0添防腐剂"实含山梨酸钾。</div>
  <div class="chart" id="chart2"></div>
  <div class="src">数据来源：17 条"宣传不实"样本逐条配料表核验（2026-09-02）。含"其他"类细分（防腐剂、香精、益生元各 1 条），合计 6 类替代成分。</div>
</div>
<script>
(function(){
  // 浅蓝色色系（6个层次，第二个为图一蓝色#8FA3AD，整体偏浅）
  var B1='#7A98A8', B2='#8FA3AD', B3='#9CB0BA', B4='#A8BCC5', B5='#B5C8D0', B6='#C2D4DB';
  var c2 = echarts.init(document.getElementById('chart2'));
  c2.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',triggerOn:'mousemove',renderMode:'richText',confine:true,textStyle:{fontSize:11,color:'#000'},
      axisPointer:{type:'shadow'},
      formatter:function(p){if(p&&p.length&&p[0]&&p[0].value!=null){return p[0].name+String.fromCharCode(10)+p[0].value+' 条（占17条宣传不实样本的 '+Math.round(p[0].value/17*100)+'%）';}return '';}},
    grid:{left:8,right:140,top:16,bottom:24,containLabel:true},
    xAxis:{type:'value',name:'条数',nameTextStyle:{color:'#000'},axisLabel:{color:'#000',fontSize:11},axisLine:{lineStyle:{color:'#000'}},splitLine:{lineStyle:{color:'#E0D8C8'}}},
    yAxis:{type:'category',inverse:true,
      data:['糖类/代糖','酵母抽提物','胶体(卡拉胶等)','防腐剂(山梨酸钾)','香精','益生元/功能配料'],
      axisLabel:{color:'#000',fontSize:12},axisLine:{lineStyle:{color:'#000'}},axisTick:{show:false}},
    series:[{type:'bar',barWidth:'52%',
      // 从上到下依次从0生长的出场动画
      animationDuration:600,
      animationEasing:'cubicOut',
      animationDelay:function(idx){return idx*150;},
      label:{show:true,position:'right',color:'#000',fontSize:12,formatter:function(p){return p.value+' 条 ('+Math.round(p.value/17*100)+'%)';}},
      itemStyle:{borderRadius:[0,6,6,0]},
      data:[
        {value:12,itemStyle:{color:B1}},
        {value:2,itemStyle:{color:B2}},
        {value:1,itemStyle:{color:B3}},
        {value:1,itemStyle:{color:B4}},
        {value:1,itemStyle:{color:B5}},
        {value:1,itemStyle:{color:B6}}
      ]}]
  });
  window.addEventListener('resize', function(){ c2.resize(); });
})();
</script>
</body>
</html>

  }, 25);

  // 响应式
  if (typeof ResizeObserver === 'function') {
    var ro = new ResizeObserver(function() { c.resize(); });
    ro.observe(dom);
  }
  window.addEventListener('resize', function() { c.resize(); });
  }
  if (document.readyState === 'complete') { init(); }
  else { window.addEventListener('load', init); }
})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亚硝酸盐转化路径 · 树状图（演示版）</title>
<style>
  body{background:transparent;color:#3D3A36;font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;margin:0;padding:28px 16px;}
  .wrap{max-width:1020px;margin:0 auto;}
  h1{font-size:22px;font-weight:700;text-align:center;margin:0 0 4px;}
  .sub{text-align:center;color:#7A7266;font-size:14px;margin:0 0 12px;}

  /* 胶囊标签按钮 */
  .mode-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .mode-btn{border:1.5px solid #C9C2B6;background:#FBFAF7;color:#3D3A36;font-size:13px;padding:7px 18px;border-radius:20px;cursor:pointer;transition:all .25s;font-family:inherit;}
  .mode-btn:hover{border-color:#8BA888;}
  .mode-btn.active{background:#3D3A36;color:#FBFAF7;border-color:#3D3A36;}
  .mode-btn.active.trad{background:#8A6240;border-color:#8A6240;color:#fff;}
  .mode-btn.active.zero{background:#4F7150;border-color:#4F7150;color:#fff;}

  .replay-bar{display:flex;justify-content:center;margin:0 0 6px;min-height:28px;}
  .replay-btn{border:1.5px solid #7E99AB;background:#FBFAF7;color:#3A5468;font-size:12px;padding:5px 14px;border-radius:18px;cursor:pointer;transition:all .2s;opacity:0;pointer-events:none;}
  .replay-btn.show{opacity:1;pointer-events:auto;}
  .replay-btn:hover{background:#E8EDF2;}

  svg{width:100%;height:auto;display:block;}
  /* 所有演示元素初始淡化 */
  .demo-el{opacity:0.2;transition:opacity .5s ease;}
  .demo-el.on{opacity:1;}
  .clickable{cursor:pointer;}
  .clickable:hover{filter:brightness(.97);}
  .clickable.act{stroke-width:3;}
  .src{font-size:12px;color:#7A7266;border-top:1px solid #DCD7CE;margin-top:14px;padding-top:12px;line-height:1.7;}
  .src a{color:#55697A;}
</style>
</head>
<body>
<div class="wrap">
  <h1>香肠 / 腌肉里的亚硝酸盐，怎么来的？</h1>
  <div class="sub">传统工艺与"无添加亚硝酸盐"工艺：两条路径，殊途同归</div>

  <!-- 胶囊标签按钮 -->
  <div class="mode-bar">
    <button class="mode-btn active" data-mode="all">对比全部</button>
    <button class="mode-btn" data-mode="trad">传统工艺</button>
    <button class="mode-btn" data-mode="zero">"无添加"工艺</button>
  </div>

  <div class="replay-bar">
    <button class="replay-btn" id="replayBtn">↻ 重新播放</button>
  </div>

  <svg viewBox="0 0 980 420" role="img" aria-label="亚硝酸盐转化路径树状图">
    <defs>
      <marker id="arwT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#B08968"/>
      </marker>
      <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#8BA888"/>
      </marker>
      <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#B58E8E"/>
      </marker>
    </defs>

    <!-- 根节点 -->
    <g class="clickable demo-el" id="nodeRoot" data-name="肉制品（香肠/腌肉）">
      <rect x="370" y="24" width="240" height="60" rx="12" fill="#E8EDF2" stroke="#7E99AB" stroke-width="1.6"/>
      <text x="490" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#3A5468">肉制品（香肠 / 腌肉）</text>
      <text x="490" y="74" text-anchor="middle" font-size="12" fill="#55697A">加工时，两种工艺走了不同的路</text>
    </g>

    <!-- 共享起点线（根到分叉点） -->
    <path class="demo-el" id="lineRootSplit" d="M490,84 L490,100" fill="none" stroke="#A89B8F" stroke-width="2"/>

    <!-- 左分支：传统工艺 -->
    <path class="demo-el" id="lineSplitL1" d="M490,100 L270,100 L270,120" fill="none" stroke="#B08968" stroke-width="2.5" marker-end="url(#arwT)"/>
    <g class="clickable demo-el" id="nodeL1" data-name="直接加亚硝酸钠">
      <rect x="160" y="120" width="220" height="64" rx="12" fill="#F0E4D6" stroke="#B08968" stroke-width="1.6"/>
      <text x="270" y="141" text-anchor="middle" font-size="12" fill="#8A6240">传统工艺 · 直接添加</text>
      <text x="270" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#5A4632">直接加"亚硝酸钠"</text>
    </g>
    <path class="demo-el" id="lineL1Merge" d="M270,184 L270,295 L490,295" fill="none" stroke="#B08968" stroke-width="2.5"/>

    <!-- 右分支："无添加"工艺 -->
    <path class="demo-el" id="lineSplitR1" d="M490,100 L710,100 L710,120" fill="none" stroke="#8BA888" stroke-width="2.5" marker-end="url(#arwG)"/>
    <g class="clickable demo-el" id="nodeR1" data-name="加芹菜粉（含硝酸盐）">
      <rect x="600" y="120" width="220" height="64" rx="12" fill="#E4EDE2" stroke="#8BA888" stroke-width="1.6"/>
      <text x="710" y="141" text-anchor="middle" font-size="12" fill="#4F7150">"无添加亚硝酸盐"工艺</text>
      <text x="710" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#3D5A3E">加"芹菜粉"（含硝酸盐）</text>
    </g>
    <path class="demo-el" id="lineR1R2" d="M710,184 L710,210" fill="none" stroke="#8BA888" stroke-width="2.5" marker-end="url(#arwG)"/>
    <g class="clickable demo-el" id="nodeR2" data-name="微生物还原">
      <rect x="600" y="210" width="220" height="64" rx="12" fill="#E4EDE2" stroke="#6F8A6D" stroke-width="1.6"/>
      <text x="710" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#3D5A3E">微生物还原</text>
      <text x="710" y="259" text-anchor="middle" font-size="12.5" fill="#4F7150">硝酸盐 → 亚硝酸盐</text>
    </g>
    <path class="demo-el" id="lineR2Merge" d="M710,274 L710,295 L490,295" fill="none" stroke="#8BA888" stroke-width="2.5"/>

    <!-- 汇合进入亚硝酸盐 -->
    <path class="demo-el" id="lineMergeNitrite" d="M490,295 L490,320" fill="none" stroke="#B58E8E" stroke-width="2.5" marker-end="url(#arwB)"/>

    <!-- 亚硝酸盐共同节点 -->
    <g class="clickable demo-el" id="nodeNitrite" data-name="亚硝酸盐（两条路都生成它）">
      <rect x="390" y="320" width="200" height="60" rx="12" fill="#EBDEDE" stroke="#B58E8E" stroke-width="2"/>
      <text x="490" y="347" text-anchor="middle" font-size="19" font-weight="800" fill="#8A4B4B">亚硝酸盐</text>
      <text x="490" y="369" text-anchor="middle" font-size="12.5" fill="#9A6A6A">两条路都生成了它</text>
    </g>
  </svg>

  <div class="src">
    <b>转化机理依据：</b>① 芹菜天然富集硝酸盐，经肉中微生物还原可生成亚硝酸盐（中国农业科学院农业信息研究所，食品伙伴网 2026-05）· <a href="http://agri.nais.net.cn/resourcenavigation/webinfo/6e953a45-9bbf-42d8-b632-312c38b05e3a.html" target="_blank">中国农科院</a>；② 添加芹菜粉肉制品的亚硝酸盐生成机制与传统添加亚硝酸盐一致，发色抑菌作用相同（《肉类研究》2015）· <a href="https://www.rlyj.net.cn/fileup/HTML/20150501.shtml" target="_blank">肉类研究</a>。
  </div>
</div>

<script>
(function(){
  var tradIds = ['nodeRoot','lineRootSplit','lineSplitL1','nodeL1','lineL1Merge','lineMergeNitrite','nodeNitrite'];
  var zeroIds = ['nodeRoot','lineRootSplit','lineSplitR1','nodeR1','lineR1R2','nodeR2','lineR2Merge','lineMergeNitrite','nodeNitrite'];
  var allIds = ['nodeRoot','lineRootSplit','lineSplitL1','nodeL1','lineL1Merge','lineSplitR1','nodeR1','lineR1R2','nodeR2','lineR2Merge','lineMergeNitrite','nodeNitrite'];

  var modeBtns = document.querySelectorAll('.mode-btn');
  var replayBtn = document.getElementById('replayBtn');
  var timers = [];
  var autoPlaying = false;

  function clearTimers(){
    timers.forEach(function(t){clearTimeout(t);});
    timers = [];
  }

  function setBtnActive(mode){
    modeBtns.forEach(function(b){
      b.className = 'mode-btn' + (b.getAttribute('data-mode')===mode ? ' active' : '');
      if(b.getAttribute('data-mode')===mode && mode==='trad') b.classList.add('trad');
      if(b.getAttribute('data-mode')===mode && mode==='zero') b.classList.add('zero');
    });
  }

  function showOnly(ids){
    allIds.forEach(function(id){
      var el = document.getElementById(id);
      if(el){
        if(ids.indexOf(id)>-1){ el.classList.add('on'); }
        else{ el.classList.remove('on'); }
      }
    });
  }

  function on(ids){
    ids.forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.classList.add('on');
    });
  }

  function resetAll(){
    allIds.forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.classList.remove('on');
    });
  }

  // 手动切换模式
  modeBtns.forEach(function(b){
    b.onclick = function(){
      autoPlaying = false;
      clearTimers();
      replayBtn.classList.remove('show');
      var mode = b.getAttribute('data-mode');
      setBtnActive(mode);
      if(mode==='all'){ showOnly(allIds); }
      else if(mode==='trad'){ showOnly(tradIds); }
      else if(mode==='zero'){ showOnly(zeroIds); }
    };
  });

  // 自动演示：传统工艺逐步 → 间隔1秒 → 无添加工艺逐步
  function play(){
    clearTimers();
    resetAll();
    setBtnActive('all');
    replayBtn.classList.remove('show');
    autoPlaying = true;

    // ===== 传统工艺：逐步高亮（每步间隔 0.6 秒）=====
    var t = 800; // 初始延迟
    timers.push(setTimeout(function(){ if(autoPlaying){setBtnActive('trad'); on(['nodeRoot']);} }, t));
    t += 600;
    timers.push(setTimeout(function(){ if(autoPlaying){on(['lineRootSplit','lineSplitL1']);} }, t));
    t += 600;
    timers.push(setTimeout(function(){ if(autoPlaying){on(['nodeL1']);} }, t));
    t += 600;
    timers.push(setTimeout(function(){ if(autoPlaying){on(['lineL1Merge']);} }, t));
    t += 600;
    timers.push(setTimeout(function(){ if(autoPlaying){on(['lineMergeNitrite']);} }, t));
    t += 600;
    timers.push(setTimeout(function(){ if(autoPlaying){on(['nodeNitrite']);} }, t));
    // 传统工艺完成

    // ===== 两工艺之间间隔 1 秒 =====
    t += 1000;

    // ===== 无添加工艺：逐步高亮（每步间隔 0.6 秒）=====
    timers.push(setTimeout(function(){ if(autoPlaying){setBtnActive('zero'); on(['lineSplitR1']);} }, t));
    t += 600;
    timers.push(setTimeout(function(){ if(autoPlaying){on(['nodeR1']);} }, t));
    t += 600;
    timers.push(setTimeout(function(){ if(autoPlaying){on(['lineR1R2']);} }, t));
    t += 600;
    timers.push(setTimeout(function(){ if(autoPlaying){on(['nodeR2']);} }, t));
    t += 600;
    timers.push(setTimeout(function(){ if(autoPlaying){on(['lineR2Merge']);} }, t));
    // lineMergeNitrite 和 nodeNitrite 已在传统工艺中点亮

    // 演示完成，切换到"对比全部"，显示重新播放按钮
    t += 600;
    timers.push(setTimeout(function(){
      if(autoPlaying){
        setBtnActive('all');
        showOnly(allIds);
        replayBtn.classList.add('show');
        autoPlaying = false;
      }
    }, t));
  }

  replayBtn.onclick = play;

  // 点击节点聚焦
  var cks = document.querySelectorAll('.clickable');
  function clearAct(){
    for (var i=0;i<cks.length;i++){
      var r = cks[i].querySelector('rect');
      if (r){ r.classList.remove('act'); r.style.strokeWidth = ''; }
    }
  }
  for (var j=0;j<cks.length;j++){
    cks[j].onclick = (function(el){
      return function(){
        clearAct();
        var r = el.querySelector('rect');
        if (r){ r.classList.add('act'); r.style.strokeWidth = '3.2'; }
      };
    })(cks[j]);
  }

  // 启动演示
  play();
})();
</script>
</body>
</html>

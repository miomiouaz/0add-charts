<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图2 · "0蔗糖"的两类替代品GI对比</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:transparent;color:#3D3A36;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.7;padding:16px;}
  .wrap{max-width:760px;margin:0 auto;}
  h2{font-size:15.5px;font-weight:700;margin-bottom:6px;color:#3D3A36;}
  .chart{width:100%;height:360px;}
  .src{font-size:11px;color:#6E8190;margin-top:6px;border-top:1px dashed #E2DCD2;padding-top:7px;line-height:1.9;}
  .src a{color:#6E8190;text-decoration:none;}
  .src a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <h2>② "0蔗糖"的两类替代品：换糖型升糖，代糖型不升糖</h2>
  <div id="c2" class="chart"></div>
  <div class="src"><b>数据来源：</b>北京同仁医院马小丽主任医师（麦芽糖浆 GI≈105）· <a href="https://m.miaoshou.net/article/Orb7wmzavLXnzDG6.html" target="_blank">妙手医生</a>｜四川省妇幼保健院科普（果葡糖浆 GI≈60）· <a href="https://m.fybj.net/mpopularize_hot/2026/yb8Xw5bv.html" target="_blank">四川妇幼</a>｜小荷健康（赤藓糖醇 GI=0、木糖醇 GI=13）· <a href="https://m.xiaohe.cn/medical/ai-qa/70000079489618" target="_blank">小荷健康</a>｜北京市卫健委《0糖食品》科普（代糖分人工代糖/糖醇类）· <a href="https://wjw.beijing.gov.cn/bmfw_20143/jkzs/jksh/202505/t20250521_4094841.html" target="_blank">北京市卫健委</a></div>
</div>
<script>
(function(){
  var CLAY="#B08968", SAGE="#8BA888", GOLD="#B8A87E";
  var c2=echarts.init(document.getElementById("c2"));
  c2.setOption({
    backgroundColor:"transparent",
    tooltip:{trigger:"axis",triggerOn:"mousemove",renderMode:"richText",confine:true,textStyle:{fontSize:11,lineHeight:15},padding:[6,8]},
    grid:{left:10,right:20,top:30,bottom:10,containLabel:true},
    xAxis:{type:"category",data:["麦芽糖浆","蔗糖（基准）","果葡糖浆","木糖醇","三氯蔗糖","赤藓糖醇"],axisLabel:{color:"#3D3A36",fontSize:11,interval:0},axisLine:{lineStyle:{color:"#3D3A36"}},axisTick:{show:false}},
    yAxis:{type:"value",name:"GI 值",nameTextStyle:{color:"#7A7266"},axisLabel:{color:"#7A7266",fontSize:11},splitLine:{lineStyle:{color:"#EDE6D8"}}},
    series:[{name:"GI",type:"bar",barWidth:44,label:{show:true,position:"top",formatter:function(p){return p.value===0?"≈0":p.value;},color:"#3D3A36",fontSize:11,fontWeight:700},
      itemStyle:{borderRadius:[6,6,0,0]},
      data:[
        {value:105,itemStyle:{color:CLAY}},
        {value:65,itemStyle:{color:"#C9C2B6"}},
        {value:60,itemStyle:{color:GOLD}},
        {value:13,itemStyle:{color:"#6F8A6D"}},
        {value:0,itemStyle:{color:SAGE}},
        {value:0,itemStyle:{color:SAGE}}
      ],markLine:{silent:true,symbol:"none",lineStyle:{color:"#8BA888",type:"dashed",width:1.5},data:[{xAxis:"木糖醇"}],label:{show:false}}}]
  });
  window.addEventListener("resize",function(){c2.resize();});
})();
</script>
</body>
</html>

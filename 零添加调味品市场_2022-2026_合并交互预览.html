<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调味品"0添加"概念商品数量与市场份额变化（2022–2026）</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; padding: 12px; color: #3D3A36; }
  .card { background: transparent; border-radius: 16px; padding: 12px; width: 100%; max-width: 1280px; margin: 0 auto; }
  .title { font-size: 16px; font-weight: 700; color: #3D3A36; line-height: 1.5; }
  .subtitle { font-size: 12px; color: #8A8578; margin-top: 5px; line-height: 1.6; }
  .chart { width: 100%; aspect-ratio: 980 / 540; min-height: 260px; margin-top: 6px; }
  .legend { display: flex; gap: 22px; font-size: 12px; color: #5A564F; margin-top: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .legend .l1 i { background: #8BA888; }
  .legend .l2 i { background: #B58E8E; }
  .legend .l3 i { height: 0; border-top: 2.5px dashed #B58E8E; border-radius: 0; }
</style>
</head>
<body>

<div class="card">
  <div class="title">调味品"0添加／零添加"概念商品数量与市场份额变化（2022Q2–2026Q2）</div>
  <div class="subtitle">柱：概念商品数量（左轴）　折线：市场份额（右轴）　·　*为估算值</div>
  <div class="legend">
    <span class="l1"><i></i>概念商品数量（柱）</span>
    <span class="l2"><i></i>市场份额（实线）</span>
    <span class="l3"><i></i>数据缺失年份（虚线连接）</span>
  </div>
  <div id="chart" class="chart"></div>
</div>

<script>
(function() {
  var quarters = ['2022Q2', '2023Q1', '2024Q1', '2024Q3', '2025Q1', '2025Q3', '2026Q1', '2026Q2'];
  var skuData = [300, 484, 876, 990, 1276, null, null, 1145];
  var shareData = [2.5, null, 4.0, 4.66, 3.95, null, null, 5.41];

  var dom = document.getElementById('chart');
  if (!dom) return;
  if (typeof echarts === 'undefined') {
    dom.innerHTML = '<div style="padding:20px;color:#8A8578;font-size:13px;">图表库加载失败，已回退为文字说明。</div>';
    return;
  }
  var c = echarts.init(dom);

  var tooltipBase = {
    trigger: 'axis',
    triggerOn: 'click',
    renderMode: 'richText',
    confine: true,
    backgroundColor: 'rgba(255,255,255,0.96)',
    borderColor: '#E4E3DD',
    textStyle: { color: '#3D3A36', fontSize: 11, lineHeight: 16 },
    padding: [8, 10]
  };

  var lineDelay = function(idx) { return 2400 + idx * 180; };
  /* 折线逐步填充：点从左到右依次出现并连线 */
  var solidOrder = [0, 2, 3, 4, 7];
  function setLineData(step) {
    var solid = [null, null, null, null, null, null, null, null];
    var d1 = [null, null, null, null, null, null, null, null];
    var d2 = [null, null, null, null, null, null, null, null];
    for (var i = 0; i < step && i < solidOrder.length; i++) {
      solid[solidOrder[i]] = shareData[solidOrder[i]];
    }
    if (step >= 2) { d1[0] = 2.5; d1[2] = 4.0; }
    if (step >= 5) { d2[4] = 3.95; d2[7] = 5.41; }
    c.setOption({
      series: [
        {}, {}, { data: solid }, { data: d1 }, { data: d2 }, {}
      ]
    }, { notMerge: false });
  }

  c.setOption({
    animation: true,
    backgroundColor: 'transparent',
    tooltip: tooltipBase,
    legend: { show: false },

    grid: { left: 66, right: 64, top: 36, bottom: 46, containLabel: true },

    xAxis: {
      type: 'category',
      data: quarters,
      axisLine: { lineStyle: { color: '#C9C2B6' } },
      axisTick: { show: false },
      axisLabel: { color: '#5A564F', fontSize: 11 }
    },

    yAxis: [
      {
        type: 'value',
        name: '商品数量（个）',
        nameTextStyle: { color: '#5F7A61', fontSize: 11 },
        min: 0, max: 1500,
        splitLine: { lineStyle: { color: '#E9E5DC' } },
        axisLabel: { color: '#5A564F', fontSize: 11 }
      },
      {
        type: 'value',
        name: '市场份额（%）',
        nameTextStyle: { color: '#96696A', fontSize: 11 },
        min: 0, max: 6,
        splitLine: { show: false },
        axisLabel: { color: '#96696A', fontSize: 11, formatter: function(v) { return v + '%'; } }
      }
    ],

    series: [
      /* ========== 柱状（左轴，从左到右依次升起） ========== */
      {
        name: '概念商品数量',
        type: 'bar',
        yAxisIndex: 0,
        barWidth: 30,
        /* 初始全部为 0，由下方定时器逐根更新为目标值 → 从底部生长升起 */
        data: [0, 0, 0, 0, 0, null, null, 0],
        itemStyle: { color: '#8BA888', borderRadius: [5, 5, 0, 0] },
        label: {
          show: true, position: 'top', fontSize: 11, color: '#3D3A36',
          formatter: function(p) { return (p.value > 0) ? p.value : ''; }
        },
        animationType: 'scale',
        animationDuration: 0,
        animationDurationUpdate: 400,
        animationEasing: 'cubicOut',
        z: 1,
        markArea: {
          silent: true,
          itemStyle: { color: 'rgba(168,155,143,0.20)' },
          label: {
            show: true, position: 'insideBottom', color: '#8A8578', fontSize: 12,
            formatter: function() { return '1000+高位平台期'; }
          },
          data: [
            [{ xAxis: '2025Q1', yAxis: 1000 }, { xAxis: '2026Q2', yAxis: 1500 }]
          ]
        }
      },
      {
        name: '柱图标注',
        type: 'scatter',
        yAxisIndex: 0,
        symbolSize: 0,
        animationDelay: 3200, animationDuration: 400,
        label: {
          show: true, fontSize: 11.5, color: '#5F7A61', position: 'bottom', distance: 6,
          formatter: function(p) { return p ? p.name : ''; }
        },
        data: [
          { name: '超1000款', value: ['2025Q3', 1350] },
          { name: '持平微升', value: ['2026Q1', 1200] }
        ],
        z: 5
      },

      /* ========== 折线（右轴，从左到右依次出现并连线，由下方定时器逐步填充数据） ========== */
      {
        name: '市场份额（实线）',
        type: 'line',
        yAxisIndex: 1,
        data: [null, null, null, null, null, null, null, null],
        connectNulls: false,
        showSymbol: true,
        symbol: 'circle', symbolSize: 8,
        itemStyle: { color: '#B58E8E', borderColor: '#FBFAF7', borderWidth: 1.5 },
        lineStyle: { color: '#B58E8E', width: 2.5 },
        label: { show: true, position: 'top', fontSize: 11, color: '#96696A' },
        animationDuration: 350,
        animationDurationUpdate: 350,
        animationEasing: 'cubicOut',
        z: 4
      },
      {
        name: '缺失连接①（2022Q2–2024Q1）',
        type: 'line',
        yAxisIndex: 1,
        data: [null, null, null, null, null, null, null, null],
        connectNulls: true,
        showSymbol: false,
        lineStyle: { color: '#B58E8E', width: 2, type: 'dashed' },
        tooltip: { show: false },
        animationDuration: 350,
        animationDurationUpdate: 350,
        z: 3
      },
      {
        name: '缺失连接②（2025Q1–2026Q2）',
        type: 'line',
        yAxisIndex: 1,
        data: [null, null, null, null, null, null, null, null],
        connectNulls: true,
        showSymbol: false,
        lineStyle: { color: '#B58E8E', width: 2, type: 'dashed' },
        tooltip: { show: false },
        animationDuration: 350,
        animationDurationUpdate: 350,
        z: 3
      },
      {
        name: '折线标注',
        type: 'scatter',
        yAxisIndex: 1,
        symbolSize: 0,
        animationDelay: 3400, animationDuration: 400,
        label: {
          show: true, fontSize: 11.5, color: '#96696A', position: 'top', distance: 6,
          formatter: function(p) { return p ? p.name : ''; }
        },
        data: [
          { name: '阶段高点3.95%', value: ['2025Q1', 5.5] },
          { name: '维持3.8%以上', value: ['2025Q3', 4.5] },
          { name: '首次突破4%', value: ['2026Q1', 5.5] }
        ],
        z: 5
      }
    ]
  });
  /* 柱状动画：每根绿柱从底部（0 高度）逐根生长到目标值，一根升完下一根再升 */
  function setBarData(arr) {
    c.setOption({ series: [{ data: arr }] }, { notMerge: false });
  }
  window.setTimeout(function() { setBarData([300, 0, 0, 0, 0, null, null, 0]); }, 200);
  window.setTimeout(function() { setBarData([300, 484, 0, 0, 0, null, null, 0]); }, 700);
  window.setTimeout(function() { setBarData([300, 484, 876, 0, 0, null, null, 0]); }, 1200);
  window.setTimeout(function() { setBarData([300, 484, 876, 990, 0, null, null, 0]); }, 1700);
  window.setTimeout(function() { setBarData([300, 484, 876, 990, 1276, null, null, 0]); }, 2200);
  window.setTimeout(function() { setBarData([300, 484, 876, 990, 1276, null, null, 1145]); }, 2700);

  /* 折线动画：柱状全部升起（约 0.2–3.1s）后，折线点从左到右逐点出现并连线 */
  setLineData(0);
  window.setTimeout(function() { setLineData(1); }, 3400); /* 2.5 */
  window.setTimeout(function() { setLineData(2); }, 3950); /* 4.0 + 虚线① */
  window.setTimeout(function() { setLineData(3); }, 4500); /* 4.66 */
  window.setTimeout(function() { setLineData(4); }, 5050); /* 3.95 */
  window.setTimeout(function() { setLineData(5); }, 5600); /* 5.41 + 虚线② */
  c.resize();
  /* 响应式：容器尺寸变化时图表自动重排（宽高按比例缩放） */
  if (typeof ResizeObserver === 'function') {
    var ro = new ResizeObserver(function() { c.resize(); });
    ro.observe(dom);
  }
  window.addEventListener('resize', function() { c.resize(); });
})();
</script>
</body>
</html>

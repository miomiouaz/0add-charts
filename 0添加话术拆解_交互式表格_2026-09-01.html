<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
  :root{--bg:#F3F0EA;--card:#FBFAF7;--ink:#4A443D;--sub:#7A7266;--line:#E2DCD2;--sage:#9CAF9A;--mauve:#A4938F;--blue:#8FA3AD;--clay:#B08968;--pink:#C4A69C;--violet:#9B8EA6;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.6;}
  header{padding:24px 18px 2px;text-align:center;}
  header h1{margin:0;font-size:20px;font-weight:800;}
  header p{margin:6px 0 0;color:var(--sub);font-size:12.5px;}
  main{max-width:1120px;margin:0 auto;padding:14px 16px 60px;}

  .ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 1px 8px rgba(74,68,61,.05);}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{border:none;background:#EFE9E0;color:var(--sub);padding:7px 16px;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .seg button.active{background:var(--clay);color:#fff;font-weight:600;}
  .seg button:hover:not(.active){background:#E6DED2;}
  #search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:12.5px;background:var(--card);color:var(--ink);outline:none;}
  #search:focus{border-color:var(--blue);}
  .count{font-size:12px;color:var(--sub);}

  .tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(74,68,61,.06);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{background:#EFE9E0;padding:10px 10px;text-align:left;font-weight:600;font-size:12px;color:var(--ink);border-bottom:2px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;}
  thead th .arr{font-size:10px;color:var(--sub);margin-left:3px;}
  tbody tr{border-bottom:1px solid #EFE9E0;cursor:pointer;transition:background .15s;}
  tbody tr:hover{background:#F6F2EB;}
  tbody tr.expanded{background:#F1EBE1;}
  td{padding:10px 10px;vertical-align:top;}
  .tag{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11px;white-space:nowrap;font-weight:600;}
  .tag.c1{background:#F3E3D8;color:#A05A3C;}
  .tag.c2{background:#E2EBEE;color:#5B7480;}
  .claim{font-weight:700;color:var(--clay);font-size:12.5px;}
  .prod{font-weight:600;}
  .role{font-size:11.5px;color:var(--sub);}
  .yes{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;background:#F3E3D8;color:#A05A3C;font-weight:600;}
  .yes2{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;background:#E2EBEE;color:#5B7480;font-weight:600;}
  .expand-cell{display:none;padding:0;}
  tr.expanded .expand-cell{display:table-cell;}
  .detail{background:#FAF7F1;border-top:1px dashed var(--line);padding:12px 14px;font-size:12.5px;color:var(--ink);}
  .detail .srcs{font-size:11px;color:var(--sub);margin-top:8px;line-height:2;}
  .detail .srcs a{color:#6E8190;text-decoration:none;}
  .detail .srcs a:hover{text-decoration:underline;}
  .arrow{color:var(--sub);font-size:11px;}
  .src-note{font-size:11.5px;color:var(--sub);margin-top:10px;}
  @media (max-width:760px){ td:nth-child(4),th:nth-child(4){display:none;} }
</style>
</head>
<body>
<header>
  <h1>"0添加"话术拆解 · 交互式表格（11 项）</h1>
  <p>点击行展开详情与权威来源｜筛选 / 搜索 / 排序｜检索截止 2026-09-01｜莫兰迪配色</p>
</header>
<main>

  <div class="ctrl">
    <div class="seg">
      <button data-f="all" class="active">全部</button>
      <button data-f="c1">情况一·换汤不换药</button>
      <button data-f="c2">情况二·偷换概念</button>

    <input id="search" type="text" placeholder="搜索产品 / 宣称 / 替代成分…">
    <span class="count" id="count"></span>
  </div>

  <div class="tbl-wrap">
    <table id="tbl">
      <thead>
        <tr>
          <th data-k="cat">类别 <span class="arr">↕</span></th>
          <th data-k="prod">产品 <span class="arr">↕</span></th>
          <th data-k="claim">包装宣称 <span class="arr">↕</span></th>
          <th data-k="sub">替代成分 / 手段</th>

          <th>是否"添加"？</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <p class="src-note">数据来源：各解释的权威依据均可在行内展开查看并点击核验（科信食品与健康信息交流中心、中国农科院、四川省妇幼保健院、北京同仁医院、天津市疾病预防控制中心、河北省市场监督管理局、中国妇女报、央广网等）。检索日期 2026-09-01。</p>

</main>

<script>
(function(){
  var rows=[
    {cat:"c1",prod:"酱油",claim:"0添加防腐剂",sub:"酵母抽提物",role:"增鲜剂",
     detail:"配料表里真正被“添加”的不是防腐剂，而是酵母抽提物——含约8%谷氨酸、呈味核苷酸（IMP/GMP），作用是增鲜、提升口感，并间接提高酱油中谷氨酸钠含量，让“0防腐剂”酱油依然鲜味充足。央广网实测：正常自然发酵酱油配料只有“水、大豆、小麦、盐”。",
     srcs:'<b>来源：</b><a href="https://m.163.com/dy/article/JV2B7JDH0512AKQV.html" target="_blank">科信食品与健康信息交流中心（网易转载）</a>｜<a href="http://www.foodscn.cn/zixun/10583" target="_blank">中国安全食品网：酵母抽提物增鲜</a>｜<a href="http://m.cnr.cn/chanjing/health/20250326/t20250326_527113473.html" target="_blank">央广网：“零添加”文字游戏</a>'},
    {cat:"c1",prod:"饮料",claim:"0蔗糖",sub:"果葡糖浆、麦芽糖浆",role:"糖类",
     detail:"不加蔗糖，但加果葡糖浆（GI≈60）、麦芽糖浆（GI高达105，&gt;蔗糖65）——升糖速度不输甚至超过蔗糖。GB 28050-2025 只规范“无糖”（总糖≤0.5g/100g），从未定义“零蔗糖”；商家只是去掉大众熟知的蔗糖，果葡糖浆等游离糖可合法添加。",
     srcs:'<b>来源：</b><a href="https://m.fybj.net/mpopularize_hot/2026/yb8Xw5bv.html" target="_blank">四川省妇幼保健院：“零蔗糖”就不升糖了吗</a>｜<a href="https://m.miaoshou.net/article/Orb7wmzavLXnzDG6.html" target="_blank">北京同仁医院：麦芽糖浆GI高达105</a>｜<a href="https://www.panan.gov.cn/col/col1229422787/art/2026/art_a2887e57a5e64589830387fe7a52f4fd.html" target="_blank">磐安县政府：警惕“无蔗糖”陷阱</a>'},
    {cat:"c1",prod:"饼干",claim:"0蔗糖",sub:"麦芽糖浆（配料表第二位）",role:"糖类",
     detail:"麦芽糖浆排在配料表第二位——按 GB 7718 第4.1.3.1.2条“配料按加入量递减排列”，意味着它加得比大多数配料都多，提供甜味和体积，热量与蔗糖接近，升糖指数却更高（GI 105 vs 65）。",
     srcs:'<b>来源：</b><a href="https://m.miaoshou.net/article/Orb7wmzavLXnzDG6.html" target="_blank">北京同仁医院：麦芽糖浆GI≈105</a>｜GB 7718-2011 第4.1.3.1.2条（配料递减排序）'},
    {cat:"c1",prod:"香肠",claim:"无添加亚硝酸盐",sub:"芹菜粉、樱桃粉",role:"防腐/护色剂",
     detail:"芹菜粉提供天然硝酸盐，经微生物还原生成亚硝酸盐，与肌红蛋白反应实现发色、抑菌、抗氧化——效果与化学亚硝酸盐完全相同。中国农科院：“芹菜粉本身不是亚硝酸盐，但它能在肉制品中‘缓慢生成’亚硝酸盐。”《肉类研究》证实樱桃、芹菜等含5.49–5115.63 mg/kg硝酸盐。",
     srcs:'<b>来源：</b><a href="http://agri.nais.net.cn/resourcenavigation/webinfo/6e953a45-9bbf-42d8-b632-312c38b05e3a.html" target="_blank">中国农业科学院农业信息研究所：芹菜粉替代亚硝酸盐</a>｜<a href="https://www.rlyj.net.cn/fileup/HTML/2017-31-9-004.shtml" target="_blank">《肉类研究》：果蔬天然硝酸盐转化</a>'},
    {cat:"c1",prod:"酸奶",claim:"0添加明胶",sub:"果胶、卡拉胶",role:"增稠/稳定剂",
     detail:"不加明胶，但加果胶（羧基与酪蛋白静电结合防沉淀、促进乳酸菌生长）、卡拉胶（增稠稳定）——功能与明胶相同。天津疾控强调：增稠剂合规添加经长期安全性评估，关键不在“有没有”，而在“是否合规、含量是否达标”。",
     srcs:'<b>来源：</b><a href="http://sf1970.cnif.cn/article/2022/0253-990X/2022-21-325.shtml" target="_blank">《食品与发酵工业》：增稠剂促进酸奶凝胶机理</a>｜<a href="http://www.cdctj.com.cn/system/2025/11/12/030179043.shtml" target="_blank">天津市疾病预防控制中心：增稠剂</a>'},
    {cat:"c1",prod:"代糖饮料",claim:"0糖 / 无糖",sub:"赤藓糖醇、三氯蔗糖等代糖",role:"甜味剂",
     detail:"“0糖”尝起来甜，正是因为加了代糖：三氯蔗糖甜度达蔗糖400–800倍，极少量即可供甜、热量近零；赤藓糖醇能量换算系数按 GB 28050-2025 为 0 kJ/g。按国标，“无糖”界限是总糖≤0.5g/100g，并非绝对零糖。",
     srcs:'<b>来源：</b><a href="https://cj.sina.com.cn/articles/view/7879776555/1d5abd92b06801zpsi" target="_blank">新浪财经：代糖甜度可达蔗糖800倍</a>｜<a href="http://scjg.hebei.gov.cn/info/113480" target="_blank">河北省市场监督管理局：GB28050界限值</a>｜<a href="https://wjw.ah.gov.cn/public/7001/57992921.html" target="_blank">安徽省卫健委：GB28050-2025问答</a>'},
    {cat:"c1",prod:"复合调味料",claim:"0味精",sub:"酵母抽提物",role:"增鲜剂",
     detail:"不加味精（谷氨酸钠），但加酵母抽提物——它富含氨基酸和肽类，可间接提高谷氨酸钠含量，达到味精同等的增鲜效果，本质仍是鲜味物质。与酱油同理，只是“0”字头的对象从防腐剂换成了味精。",
     srcs:'<b>来源：</b><a href="https://m.163.com/dy/article/JV2B7JDH0512AKQV.html" target="_blank">科信食品与健康信息交流中心（网易转载）：配料表陷阱</a>'},
    {cat:"c1",prod:"老抽/调味品",claim:"0色素",sub:"红曲红、焦糖色等天然着色剂",role:"着色剂",
     detail:"不加人工合成色素，但加红曲红、焦糖色等天然着色剂。焦糖色素上色能力极强（老抽类必备），天然来源≠不是色素——“0色素”往往只是“0合成色素”的省略。",
     srcs:'<b>来源：</b><a href="https://epaper.cnwomen.com.cn/images/2022-10/13/8/08BLM08Ca13_h.pdf" target="_blank">中国妇女报：酱油中的“门道儿”（焦糖色素）</a>'},
    {cat:"c2",prod:"罐头/酱料",claim:"0添加防腐剂",sub:"高温灭菌 / 物理锁鲜工艺",role:"工艺替代（非“没添加”）",
     detail:"靠高温高压杀菌、物理锁鲜等工艺达到商业无菌，实现不添加化学防腐剂——防腐功能外包给了工艺，而非“没做防腐”。部分产品仍靠高糖高盐或抗氧化剂（如D-异抗坏血酸钠）实现，需看配料表确认。",
     srcs:'<b>来源：</b><a href="https://c.m.163.com/news/a/KC0NC2GT0514CKC4.html" target="_blank">网易新闻：午餐肉发酵+高温高压杀菌</a>｜<a href="https://m.canyin88.com/zixun/2026/03/05/110964.html" target="_blank">红餐网：仲景香菇酱灭菌工艺</a>'},
    {cat:"c2",prod:"烘焙/薯片",claim:"0反式脂肪酸",sub:"国标界限值 ≤0.3g/100g",role:"界限声称（非绝对零）",
     detail:"按 GB 28050，反式脂肪酸含量≤0.3g/100g 即可标“0反式”，并非绝对为零——与“0糖”界限（≤0.5g/100g）同一套逻辑，属于“含量声称的界限值”，不是数学意义的零。",
     srcs:'<b>来源：</b><a href="https://m.gmw.cn/2025-03/31/content_1304004985.htm" target="_blank">光明网：预包装食品标签禁标“零添加”</a>｜<a href="http://scjg.hebei.gov.cn/info/113480" target="_blank">河北省市场监督管理局：GB28050界限值</a>'},
    {cat:"c2",prod:"各类预包装食品",claim:"纯天然 / 无添加",sub:"“万能标签”话术",role:"营销筛选词",
     detail:"“纯天然”“无添加”“有机”被部分商家当万能标签滥用，含义模糊、无统一标准定义——福州市市场监管局已将其列为“万能标签”虚假宣传套路。",
     srcs:'<b>来源：</b><a href="http://bgimg.ce.cn/cysc/zljd/gd/202608/t20260806_3130538.shtml" target="_blank">中国经济网：福州“纯天然/零添加/有机”万能标签套路</a>'}
  ];

  var tbody=document.getElementById("tbody"), count=document.getElementById("count"), search=document.getElementById("search");
  var filter="all", q="", sortKey=null, sortDir=1;

  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  function render(){
    var list=rows.filter(function(r){
      if(filter!=="all" && r.cat!==filter) return false;
      if(q){
        var hay=(r.prod+r.claim+r.sub+r.role).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    if(sortKey){list.sort(function(a,b){var x=a[sortKey],y=b[sortKey];if(x<y)return -sortDir;if(x>y)return sortDir;return 0;});}
    count.textContent="显示 "+list.length+" / "+rows.length+" 项";
    tbody.innerHTML=list.map(function(r){
      var tag = r.cat==="c1" ? '<span class="tag c1">情况一·换汤不换药</span>' : '<span class="tag c2">情况二·偷换概念</span>';
      var yes = r.cat==="c1" ? '<span class="yes">是</span>' : '<span class="yes2">是（界限/话术）</span>';
      return '<tr data-i="'+rows.indexOf(r)+'">'
        +'<td>'+tag+'</td>'
        +'<td class="prod">'+esc(r.prod)+'</td>'
        +'<td class="claim">'+esc(r.claim)+'</td>'
        +'<td>'+esc(r.sub)+'</td>'
        +'<td><span class="role">'+esc(r.role)+'</span></td>'
        +'<td>'+yes+'</td>'
        +'<td><span class="arrow">▾</span></td>'
        +'</tr>'
        +'<tr class="detail-row" style="display:none;"><td colspan="7"><div class="detail">'+r.detail+'<div class="srcs">'+r.srcs+'</div></div></td></tr>';
    }).join("");
  }

  tbody.addEventListener("click",function(ev){
    var tr=ev.target.closest("tr");
    if(!tr) return;
    if(tr.classList.contains("detail-row")) return;
    var next=tr.nextElementSibling;
    var wasOpen=next && next.classList.contains("detail-row") && next.style.display!=="none";
    // close all
    var rows2=tbody.querySelectorAll("tr.detail-row");
    for(var i=0;i<rows2.length;i++){rows2[i].style.display="none";}
    tbody.querySelectorAll("tr[data-i]").forEach(function(t){t.classList.remove("expanded");});
    if(next && next.classList.contains("detail-row") && !wasOpen){
      next.style.display="table-row";
      tr.classList.add("expanded");
    }
  });

  document.querySelectorAll(".seg button").forEach(function(b){
    b.addEventListener("click",function(){
      document.querySelectorAll(".seg button").forEach(function(x){x.classList.remove("active");});
      b.classList.add("active");
      filter=b.getAttribute("data-f");
      render();
    });
  });

  var searchTimer=null;
  search.addEventListener("input",function(){
    clearTimeout(searchTimer);
    var v=this.value.trim().toLowerCase();
    searchTimer=setTimeout(function(){q=v;render();},200);
  });

  document.querySelectorAll("thead th[data-k]").forEach(function(th){
    th.addEventListener("click",function(){
      var k=th.getAttribute("data-k");
      if(sortKey===k){sortDir*=-1;}else{sortKey=k;sortDir=1;}
      document.querySelectorAll("thead th .arr").forEach(function(a){a.textContent="↕";});
      th.querySelector(".arr").textContent=sortDir===1?"▲":"▼";
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
